name: Build and verify published v0.1.1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout original published source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6bf7314b3dac5c1f2af1937eb06859afdcd09d66
          path: release-source
          persist-credentials: false
      - name: Set up Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile current source and run tests
        shell: powershell
        run: .\build.ps1
      - name: Fetch original release for static inspection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\published-v0.1.1 | Out-Null
          $base = 'https://github.com/slytess/hit-fix-minecraft-lunarclient/releases/download/v0.1.1'
          Invoke-WebRequest "$base/LunarHitFixInstaller.exe" -OutFile build\published-v0.1.1\LunarHitFixInstaller.exe -UseBasicParsing
          Invoke-WebRequest "$base/hitfix-agent.jar" -OutFile build\published-v0.1.1\hitfix-agent.jar -UseBasicParsing
      - name: Verify published binary against independently compiled source
        shell: powershell
        run: .\tools\audit-release.ps1 -SourceDirectory .\release-source -ReleaseDirectory .\build\published-v0.1.1 -OutputPath .\build\security-evidence\v0.1.1-verification.json
      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v0.1.1-source-correspondence-evidence
          path: build/security-evidence/v0.1.1-verification.json
          if-no-files-found: error
